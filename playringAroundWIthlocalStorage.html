<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .parent {
        display: flex;
        justify-content: space-around;
      }
      .local-storage-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      #text-field {
        width: 305px;
        border: 5px solid green;
      }
      #text-field-2 {
        width: 305px;
        border: 5px solid blueviolet;
      }
      .hidden {
        display: none;
        /* font-family:
        "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serifS;*/
      }

      .text-2 {
        width: 200px;
        font: 45px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="parent">
      <div class="local-storage-container">
        <h1>Without Local Storage</h1>
        <input
          type="text"
          name=""
          id="text-field"
          placeholder="Type Text Here"
        />
        <h2 class="hidden">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos,
          deserunt.
        </h2>
      </div>

      <div class="local-storage-container">
        <h1>With Local Storage</h1>
        <input
          type="text"
          name=""
          id="text-field-2"
          placeholder="Type Text Here"
        />
        <div class="hidden-2">
          <h2 class="text-2">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos,
            deserunt.
          </h2>
        </div>
      </div>
    </div>

    <script>
      const randomText = document.querySelector(".hidden");
      const randomText2 = document.querySelector(".hidden-2");
      const inputField = document.querySelector("#text-field");
      const inputField2 = document.querySelector("#text-field-2");
      const inputFieldState = localStorage.getItem("keyValue");
      console.log(inputFieldState);
      randomText2.innerHTML = inputFieldState;

      document.body.addEventListener("keydown", function (e) {
        // // Without local storage
        //   if (e.key === "Enter") {
        //     randomText.classList.remove("hidden");
        //     randomText.innerHTML = inputField.value;
        //     inputField.value = "";
        //     randomText.style.fontFamily = "Helvetica";
        //   }
        /*-----------------------------------------------------------------------*/
        // // With the localStorage
        if (e.key === "Enter") {
          randomText2.classList.remove("hidden-2");
          localStorage.setItem("keyValue", inputField2.value);
          randomText2.style.fontFamily = "Helvetica";
          randomText2.innerHTML = localStorage.getItem("keyValue");
          randomText2.style.fontSize = "45px";
        }
      });
    </script>
  </body>
</html>

<!-- 
localStorage -> memory for the localHost in this case the liveServer

-->
