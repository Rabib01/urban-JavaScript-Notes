<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practise</title>
    <style>
      body {
        height: 100vh;
        /* display: flex; */
        /* align-items: center; */
        background: linear-gradient(to top left, #28b487, #7dd56f);
      }
      .title {
        display: flex;
        justify-content: center;
      }
      .title * {
        font-family: sans-serif;
        font-size: 50px;
        line-height: 1.3;
        width: 100%;
        padding: 30px;
        text-align: center;
        color: white;
      }
      .button-container {
        display: flex;
        justify-content: space-around;
      }
      .button-container * {
        border: 8px solid #ffffff;
        border-radius: 10px;
        width: 100px;
        height: 50px;
        background: transparent;
        color: azure;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        font-weight: bold;
        font-size: 20px;
      }
      .button-container *:hover {
        border: 8px solid #ddd2d2;
      }
    </style>
  </head>
  <body>
    <div class="title">
      <h1 class="hello-text">Hello</h1>
    </div>
    <div class="button-container">
      <button class="button-1">Button-1</button>
      <button class="button-2">Button-2</button>
      <button class="button-3">Button-3</button>
    </div>
    <script>
      const buttonContainer = document.querySelector(".button-container");
      const helloText = document.querySelector(".hello-text");

      // basically we use closest matches and contains
      // .closest() is one of the most useful DOM methods to know. It starts at an element and walks up the DOM tree until it finds an ancestor (or itself) that matches a CSS selector.
      // .closest() also works for nested div elements. This part i am not super sure about

      // Adding event delegation ->
      buttonContainer.addEventListener("click", function (e) {
        // console.log(e.target.innerHTML);

        // best-practise
        const button = e.target.closest("button");

        //adding guard clause in case there are not buttons
        if (!button) return;

        if (button.classList.contains("button-1")) {
          helloText.innerText = `Hi ${button.className}`;
        }

        if (button.classList.contains("button-2")) {
          helloText.innerText = `Hi ${button.className}`;
        }

        if (button.classList.contains("button-3")) {
          helloText.innerText = `Hi ${button.className}`;
        }
      });
    </script>
  </body>
</html>
