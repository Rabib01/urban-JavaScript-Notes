<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Don't Click</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
        font-family: monospace;
        cursor: crosshair;
      }

      #canvas {
        position: fixed;
        inset: 0;
      }

      #text {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: white;
        font-size: clamp(20px, 4vw, 60px);
        letter-spacing: 8px;
        text-align: center;
        pointer-events: none;
        z-index: 10;
        text-shadow: 0 0 20px white;
        transition: opacity 0.5s;
      }

      #counter {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #555;
        z-index: 20;
      }

      #warning {
        position: fixed;
        bottom: 20px;
        right: 20px;
        color: #333;
        z-index: 20;
      }

      .glitch {
        animation: glitch 0.08s infinite;
      }

      @keyframes glitch {
        0% {
          transform: translate(0);
        }
        25% {
          transform: translate(4px, -2px);
        }
        50% {
          transform: translate(-3px, 3px);
        }
        75% {
          transform: translate(2px, 1px);
        }
        100% {
          transform: translate(0);
        }
      }
    </style>
  </head>

  <body>
    <!-- code given by my best pal Geeps -->
    <canvas id="canvas"></canvas>

    <div id="text">MOVE YOUR MOUSE</div>
    <div id="counter">0</div>
    <div id="warning">something is watching</div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const text = document.getElementById("text");
      const counter = document.getElementById("counter");

      let w, h;
      let particles = [];
      let mouse = { x: 0, y: 0 };
      let clicks = 0;
      let started = false;

      function resize() {
        w = canvas.width = innerWidth * devicePixelRatio;
        h = canvas.height = innerHeight * devicePixelRatio;
        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";
        ctx.scale(devicePixelRatio, devicePixelRatio);
        w = innerWidth;
        h = innerHeight;
      }

      resize();
      addEventListener("resize", resize);

      addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;

        if (!started) {
          started = true;
          text.textContent = "KEEP MOVING";
        }

        for (let i = 0; i < 3; i++) {
          particles.push({
            x: mouse.x,
            y: mouse.y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1,
            size: Math.random() * 3 + 1,
          });
        }
      });

      addEventListener("click", (e) => {
        clicks++;
        counter.textContent = clicks;

        // EXPLOSION
        for (let i = 0; i < 150; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 15 + 2;

          particles.push({
            x: e.clientX,
            y: e.clientY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: Math.random() * 5 + 1,
          });
        }

        if (clicks === 1) {
          text.textContent = "WHY?";
        }

        if (clicks === 3) {
          text.textContent = "STOP.";
        }

        if (clicks === 5) {
          text.textContent = "I SAID STOP.";
          text.classList.add("glitch");
        }

        if (clicks === 7) {
          document.body.style.background = "white";
          text.style.color = "black";
          text.textContent = "YOU BROKE IT";
        }

        if (clicks === 10) {
          location.reload();
        }
      });

      function draw() {
        ctx.fillStyle = "rgba(5,5,5,.15)";
        ctx.fillRect(0, 0, w, h);

        // Draw gravitational field
        for (let i = 0; i < 100; i++) {
          const angle = i * 0.3 + performance.now() * 0.0005;
          const radius = 100 + Math.sin(performance.now() * 0.001 + i) * 50;

          const x = mouse.x + Math.cos(angle) * radius;
          const y = mouse.y + Math.sin(angle) * radius;

          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fillStyle = "white";
          ctx.fill();
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];

          p.x += p.vx;
          p.y += p.vy;

          p.vx *= 0.98;
          p.vy *= 0.98;
          p.vy += 0.08;

          p.life -= 0.015;

          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = "white";
          ctx.fill();

          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }

        ctx.globalAlpha = 1;

        requestAnimationFrame(draw);
      }

      draw();
    </script>
  </body>
</html>
